[package]
name = "hana_launcher"
version = "1.0.3"
edition = "2024"

[[bin]]
name = "HanaLauncher"
path = "src/main.rs"

# Shrink the shipped executable (keeps the launcher exe small; the heavy
# assets live in the separate resources/ folder).
[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6.0.0"
eframe = "0.36.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "stream", "form", "native-tls", "charset", "system-proxy"] }
rfd = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
uuid = { version = "1.24.1", features = ["v3", "v4"] }
webbrowser = "1.2.4"
zip = "8.6.0"

[build-dependencies]
winresource = "0.1"
